<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyStudio">
<meta name="theme-color" content="#1f1618">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>MyStudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : salle de projection — barre du haut façon marquise, contenu en une colonne, onglets en bas */
:root{
  --bg:#130d0f; --panel:#1f1618; --panel2:#2a1e20; --line:#3d2c2e;
  --fg:#f4eadd; --muted:#b5a296; --gold:#e9b24c; --gold-ink:#1c1206;
  --curtain:#a8323b; --good:#76c27a; --bad:#e5645d; --warn:#e9b24c;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
html,body,button,input{touch-action:manipulation}
input{font-size:16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Marquise */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand b{color:var(--gold)}
.date{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top .grow{flex:1;min-width:0}
.next{background:var(--gold);color:var(--gold-ink);border:0;border-radius:6px;padding:9px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.next:active{transform:translateY(1px)}
.moi{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-weight:700;font-size:14px}
.bulbs{height:5px;background:radial-gradient(circle,var(--gold) 1.5px,transparent 2px) 0 0/12px 5px repeat-x;opacity:.55}
.stats{display:flex;gap:18px;padding-block:8px;font-size:13px;flex-wrap:wrap}
.stats span{color:var(--muted)}
.stats strong{font-family:var(--f-mono);font-weight:600}

main{padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.gold{color:var(--gold);border-color:#6b5124}
.chip.good{color:var(--good);border-color:#355a37}
.chip.bad{color:var(--bad);border-color:#6b2f2c}
.chip.red{color:#ffd9d6;background:var(--curtain);border-color:var(--curtain)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:600;text-align:left}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);text-align:center}
.btn.danger{border-color:#6b2f2c;color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.inc{border-color:var(--curtain);background:linear-gradient(var(--panel),var(--panel)) padding-box}
.inc .label{color:#f19a93}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px}
.log div{display:grid;grid-template-columns:52px 1fr;gap:8px}
.log span{color:var(--muted);font-family:var(--f-mono);font-size:12px;padding-top:2px}
.chart{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:6px}
.chart i{flex:1;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px}
.chart i.n{background:var(--bad)}
.film-title{font-family:var(--f-display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}

/* Onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--gold)}

/* Feuille (assistant, sortie) */
.veil{position:fixed;inset:0;background:rgba(5,2,3,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column}
.sheet-head{padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-head .grow{flex:1;min-width:0}
.x{background:var(--panel2);border:1px solid var(--line);border-radius:6px;width:34px;height:34px;font-size:18px;line-height:1}
.sheet-body{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--gold)}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt[disabled]{opacity:.4}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.meters .bar{height:5px}
.choices{display:flex;gap:6px;flex-wrap:wrap}
.choices button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.choices button small{font-weight:500;color:var(--muted);font-size:11px}
.choices button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.choices button[disabled]{opacity:.35}
input[type=range]{width:100%;accent-color:var(--gold)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:20px}
.stepper strong{font-family:var(--f-mono);font-size:20px;min-width:3ch;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.opt{transition:border-color .15s}}
</style>

<div class="top">
  <div class="wrap">
    <div class="grow">
      <div class="brand">My<b>Studio</b></div>
      <div class="date" id="date"></div>
    </div>
    <button class="moi" data-a="tab" data-id="moi" aria-label="Mon profil de producteur">Moi</button>
    <button class="next" id="next" data-a="next">Semaine ▸</button>
  </div>
  <div class="bulbs"></div>
  <div class="wrap stats" id="stats"></div>
</div>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" id="tabs"></div>
</nav>

<div id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Données de base ---------- */
const GENRES={
  'Comédie':{appeal:1.05,heavy:false,season:{6:1.1,11:1.15}},
  'Drame':{appeal:.8,heavy:false,season:{0:1.15,1:1.1,10:1.1}},
  'Action':{appeal:1.15,heavy:true,season:{5:1.2,6:1.3,7:1.3}},
  'Horreur':{appeal:.95,heavy:false,season:{9:1.45}},
  'Science-fiction':{appeal:1.1,heavy:true,season:{6:1.2,11:1.1}},
  'Thriller':{appeal:.95,heavy:false,season:{2:1.1,9:1.1}},
  'Romance':{appeal:.85,heavy:false,season:{1:1.45}},
  'Animation':{appeal:1.2,heavy:true,season:{6:1.3,7:1.3,11:1.4}}
};
const TITLES={
  'Action':[["Opération","Code","Protocole","Cible","Mission","Unité"],["Minuit","Rouge","Fantôme","Zéro","Tempête","Faucon"]],
  'Horreur':[["La Maison","Le Puits","La Chambre","Les Enfants","Le Murmure","La Cave"],["du lac","d'en bas","oubliée","de l'hiver","sans visage","des Fagnes"]],
  'Comédie':[["Le Dîner","Les Beaux-Parents","La Coloc","Le Gendre","Les Cousins","Le Barbecue"],["de l'enfer","à Knokke","en panique","presque parfait","sous les tropiques","du dimanche"]],
  'Drame':[["Les Saisons","La Lettre","Le Silence","Les Heures","L'Héritage","La Traversée"],["d'Anna","de mon père","du port","perdues","de Liège","d'Elena"]],
  'Science-fiction':[["Orbite","Horizon","Station","Nébuleuse","Signal","Colonie"],["Zéro","Kepler","7","Écho","Perdu","Delta"]],
  'Thriller':[["L'Alibi","Le Témoin","La Disparue","Le Dossier","L'Inconnu","La Fuite"],["du train de nuit","de Bruges","silencieux","Vermeer","du 14e","de minuit"]],
  'Romance':[["Un été","Deux billets","La Promesse","Un café","Rendez-vous","Une saison"],["à Rome","pour Lisbonne","sous la pluie","à Paris","en hiver","à Dinant"]],
  'Animation':[["Pip","Capitaine Noisette","Lumi","Le Petit Yéti","Moka","Zou"],["et le dragon","des nuages","sous la glace","et l'arbre magique","au pays des rêves","fait son cirque"]]
};
const FIRST=['Léa','Hugo','Inès','Lucas','Chloé','Théo','Camille','Nathan','Sofia','Adrien','Maëlle','Jonas','Elsa','Victor','Nora','Samuel','Jade','Rayan','Alice','Mathéo','Clara','Yanis','Margaux','Louis','Romy','Basile'];
const LAST=['Delvaux','Moreau','Lambert','Peeters','Dumont','Renard','Fontaine','Marchal','Janssens','Leroy','Bastin','Collard','Gilson','Vermeulen','Simon','Hermans','Lejeune','Dubois','Mertens','Willems','Castelli','Ortega'];
const RIVALS=['Lumen Pictures','Mosa Films','Northgate','Vega Studios','Atlas Cinéma','Ardenne Prod'];
const BUDGETS=[
  {k:'Modeste',w:4000,score:30,t:0},
  {k:'Standard',w:15000,score:55,t:0},
  {k:'Ambitieux',w:60000,score:75,t:1},
  {k:'Grand spectacle',w:180000,score:88,t:2},
  {k:'Blockbuster',w:450000,score:97,t:3}
];
const TIERS=[
  {n:'Garage indé',plat:1,screens:300,mkt:60000,frais:1000,cost:0,rep:0},
  {n:'Studio indépendant',plat:2,screens:1200,mkt:400000,frais:6000,cost:250000,rep:25},
  {n:'Studio moyen',plat:3,screens:3000,mkt:2000000,frais:20000,cost:1200000,rep:50},
  {n:'Major',plat:5,screens:4500,mkt:12000000,frais:60000,cost:6000000,rep:75}
];
const SCREEN_COST=80;
const FESTS=[
  {n:'Gala des Étoiles d\'Or',wk:8,fee:5000,min:62,d:'La grande cérémonie des récompenses'},
  {n:'Festival de la Riviera',wk:20,fee:8000,min:70,d:'Le festival le plus prestigieux'},
  {n:'Festival du Film d\'Ostende',wk:30,fee:3000,min:50,d:'Festival belge, ouvert aux petits films'},
  {n:'Lion de la Lagune',wk:36,fee:8000,min:68,d:'Festival d\'auteur réputé'}
];
const CHANNELS={intl:{n:'Ventes à l\'étranger',buyers:['un distributeur allemand','un distributeur italien','un acheteur nord-américain','un distributeur japonais','un distributeur espagnol']},
  stream:{n:'Streaming',buyers:['Streamflix','Vidéo Prime','Canal Nuage','Popcorn+']},
  tv:{n:'Télévision',buyers:['TéléMosa','Canal Ardenne','Antenne 7','La Une Belge']}};
const TRAININGS=[
  {id:'nego',n:'Négociation des contrats',c:15000,d:'Cachets des talents −10 %'},
  {id:'plateau',n:'Gestion de plateau',c:12000,d:'Moins d\'imprévus de tournage'},
  {id:'mkt',n:'Marketing cinéma',c:20000,d:'Le marketing crée 15 % de buzz en plus'},
  {id:'flair',n:'Lecture de scénarios',c:25000,d:'+3 de qualité sur chaque film'}
];
const BUYS=[
  {id:'montre',n:'Montre de collection',c:25000,rep:0},
  {id:'voiture',n:'Voiture de sport',c:120000,rep:1},
  {id:'appart',n:'Appartement à Bruxelles',c:350000,rep:2},
  {id:'villa',n:'Villa à Knokke',c:1200000,rep:4},
  {id:'yacht',n:'Yacht en Méditerranée',c:3500000,rep:5}
];
const SALARIES=[0,1000,2500,5000,10000];
const CINEMAS=[
  {id:'quartier',n:'Le Palace, cinéma de quartier',sc:4,c:300000},
  {id:'multi',n:'Multiplexe régional',sc:12,c:1500000},
  {id:'chaine',n:'Chaîne de multiplexes',sc:60,c:8000000},
  {id:'reseau',n:'Réseau national de salles',sc:250,c:40000000}
];
const SCREEN_INCOME=350;
const TROPHIES=[
  {id:'first',n:'Première séance',d:'Sortir ton premier film'},
  {id:'profit',n:'Dans le vert',d:'Un film rentable'},
  {id:'sel',n:'Sur la Croisette',d:'Être sélectionné en festival'},
  {id:'prix',n:'Primé',d:'Gagner un prix en festival'},
  {id:'m1',n:'Le million',d:'Un film à 1 million € au box-office'},
  {id:'m10',n:'Gros succès',d:'Un film à 10 millions €'},
  {id:'m100',n:'Phénomène',d:'Un film à 100 millions €'},
  {id:'franchise',n:'Trilogie',d:'Sortir le 3e film d\'une saga'},
  {id:'salles',n:'Exploitant',d:'Posséder tes propres salles'},
  {id:'contrat',n:'Écurie de talents',d:'Signer un talent sous contrat'},
  {id:'major',n:'Major',d:'Atteindre le palier Major'},
  {id:'n1',n:'N° 1 du box-office',d:'Finir une année premier du classement'},
  {id:'legende',n:'Légende du cinéma',d:'Finir trois années n° 1 du classement'}
];
const INC=[
  {t:'Pluie battante',d:'Trois jours de déluge sur les extérieurs.',o:[{l:'Attendre une éclaircie',weeks:1},{l:'Tourner sous la pluie',q:-3}]},
  {t:'Caprice de star',d:'{A} exige une loge plus grande et un chef privé.',o:[{l:'Céder',costF:.4},{l:'Refuser net',hype:-5,q:-1}]},
  {t:'Décor effondré',d:'Le décor principal a cédé pendant la nuit.',o:[{l:'Reconstruire',costF:.8},{l:'Réécrire la scène',q:-3}]},
  {t:'Idée du réalisateur',d:'{D} veut tourner une scène supplémentaire.',o:[{l:'Accepter',weeks:1,q:4},{l:'Refuser'}]},
  {t:'Fuite sur les réseaux',d:'Une vidéo du tournage circule en ligne.',o:[{l:'Jouer le jeu',hype:6,costF:.1},{l:'Faire retirer la vidéo',costF:.25}]},
  {t:'Acteur malade',d:'{A} est cloué au lit.',o:[{l:'Décaler le planning',weeks:1},{l:'Prendre une doublure',q:-4}]},
  {t:'Caméra en panne',d:'La caméra principale ne démarre plus.',o:[{l:'Louer en urgence',costF:.5},{l:'Attendre la réparation',weeks:1}]},
  {t:'Rushes prometteurs',d:'Les premières images sont excellentes.',o:[{l:'Montrer à la presse',hype:5},{l:'Peaufiner en secret',q:2}]}
];
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const STAGES={tournage:['Tournage','gold'],postprod:['Post-production',''],pret:['Prêt à sortir','good'],programme:['Sortie programmée','gold'],salles:['En salles','red'],termine:['Terminé','']};

/* ---------- Outils ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r500=x=>Math.max(500,Math.round(x/500)*500);
const eur=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('fr-BE')+' €';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dateOf(w){const y=2027+Math.floor((w-1)/52),wk=(w-1)%52+1;return{y,wk,m:Math.min(11,Math.floor((wk-1)/4.34))}}
const dateLabel=w=>{const d=dateOf(w);return `Sem. ${d.wk} · ${MONTHS[d.m]} ${d.y}`};
const season=(g,w)=>GENRES[g].season[dateOf(w).m]||1;

let S, tab='home', W=null, R=null;
const nid=()=>S.nextId++;

/* ---------- Génération ---------- */
function genTitle(g){const [a,b]=TITLES[g];return (pick(a)+' '+pick(b)).trim()}
function genName(){return pick(FIRST)+' '+pick(LAST)}
function skewTalent(){return Math.random()<.6?ri(20,58):ri(55,94)}
function genDirector(){const t=skewTalent(),s=clamp(Math.round(t*rnd(.2,1.05)+rnd(-8,8)),0,100);return{id:nid(),name:genName(),talent:t,star:s,fee:r500(1500+t*t*2+s*s*12),busy:0}}
function genActor(){const t=skewTalent(),s=clamp(Math.round(t*rnd(.15,1.1)+rnd(-8,10)),0,100);return{id:nid(),name:genName(),talent:t,star:s,fee:r500(1000+t*t*1.5+s*s*15),busy:0}}
function genScript(){const g=pick(Object.keys(GENRES));const lo=20+S.tier*10,hi=72+S.tier*8;const q=ri(lo,Math.min(97,hi));return{id:nid(),title:genTitle(g),genre:g,quality:q,price:r500((1000+q*q*2)*(1+S.tier*.8))}}
function refreshMarket(){S.scripts=[...S.scripts.filter(x=>x.sequelOf),...Array.from({length:5},genScript)];S.marketWeek=S.week}
function ensureComps(){
  for(let w=Math.max(S.compGen+1,S.week+1);w<=S.week+10;w++){
    const n=ri(1,3);for(let i=0;i<n;i++){const g=pick(Object.keys(GENRES));S.comps.push({week:w,title:genTitle(g),genre:g,studio:pick(RIVALS),force:ri(15,100)})}
    S.compGen=w;
  }
  S.comps=S.comps.filter(c=>c.week>=S.week-3);
}
function compLoad(w){return S.comps.reduce((s,c)=>s+(c.week===w?c.force:c.week===w-1?c.force*.6:c.week===w-2?c.force*.3:0),0)}
const compFactor=w=>1/(1+compLoad(w)/350);

function newGame(){
  S={v:4,week:1,cash:150000,rep:5,tier:0,nextId:1,directors:[],actors:[],scripts:[],projects:[],comps:[],compGen:0,ledger:[],log:[],cashHist:[150000],marketWeek:1};addV3();addV4();
  for(let i=0;i<14;i++)S.directors.push(genDirector());
  for(let i=0;i<22;i++)S.actors.push(genActor());
  refreshMarket();ensureComps();
  addLog('Ton garage est loué. Un plateau, 150 000 € et beaucoup d\'ambition.');
}

/* ---------- Sauvegarde ---------- */
function save(){try{localStorage.setItem('mystudio-v1',JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem('mystudio-v1');if(t){S=JSON.parse(t);return true}}catch(e){}return false}

/* ---------- Économie ---------- */
function pay(amt,label,o={}){
  const k=o.k||'pl',tva=k==='pl'&&o.tva!==false?Math.round(amt*.21):0;
  S.cash+=amt+tva;
  if(k==='pl'&&S.yr){if(amt>0)S.yr.rev+=amt;else S.yr.exp-=amt}
  if(tva&&S.tq){if(amt>0){S.tq.out+=tva;S.tq.b03+=amt}else{S.tq.ded-=tva;S.tq.b82-=amt}}
  S.ledger.unshift({w:S.week,label,amt,tva});if(S.ledger.length>80)S.ledger.length=80;
}
function addV4(){S.rivals={};RIVALS.forEach(r=>S.rivals[r]=0);S.yGross=0;S.hist=[];S.n1=0;S.trophies=[];S.rec={gross:null,critic:null,profit:null};S.cinemas=[];
  S.projects.filter(p=>p.stage==='termine').forEach(p=>checkRecords(p));}
function trophy(id){if(S.trophies.includes(id))return;S.trophies.push(id);const t=TROPHIES.find(t=>t.id===id);addLog(`Trophée débloqué : ${t.n} — ${t.d}.`);toast('Trophée : '+t.n)}
function checkRecords(p){const g=p.gross||0,pr=p.revenue-p.cost;
  if(!S.rec.gross||g>S.rec.gross.v)S.rec.gross={t:p.title,v:g};
  if(!S.rec.critic||p.quality>S.rec.critic.v)S.rec.critic={t:p.title,v:p.quality};
  if(!S.rec.profit||pr>S.rec.profit.v)S.rec.profit={t:p.title,v:pr};}
const ownScreens=()=>S.cinemas.reduce((t,id)=>t+CINEMAS.find(c=>c.id===id).sc,0);
function addV3(){
  S.yr={y:dateOf(S.week).y,rev:0,exp:0};S.tq={out:0,ded:0,b03:0,b82:0};S.tvaDecl=null;S.closing=null;S.assets=[];S.subs=[];
  S.me={cash:5000,salary:0,placed:0,rate:+rnd(2,7).toFixed(1),gains:0,trained:[],owned:[]};
}
const has=id=>S.me.trained.includes(id);
const feeOf=t=>t.contract?t.contract.fee:Math.round(t.fee*(has('nego')?.9:1));
function addLog(txt){S.log.unshift({w:S.week,txt});if(S.log.length>40)S.log.length=40}
const fraisNow=()=>Math.round(TIERS[S.tier].frais*(1+.15*S.projects.filter(p=>!['termine','pret','programme'].includes(p.stage)).length)*Math.pow(1.05,dateOf(S.week).y-2027));
const freePlateaux=()=>TIERS[S.tier].plat-S.projects.filter(p=>p.stage==='tournage').length;
const proj=id=>S.projects.find(p=>p.id===id);

function finalizeQuality(p){
  const B=BUDGETS[p.budget],heavy=GENRES[p.genre].heavy;
  const act=p.cast.reduce((s,a)=>s+a.talent,0)/p.cast.length;
  let q=heavy?p.scriptQ*.3+p.dir.talent*.25+act*.2+B.score*.25:p.scriptQ*.36+p.dir.talent*.28+act*.22+B.score*.14;
  if(p.weeks<4)q-=5;else if(p.weeks>=8)q+=3;
  q+=p.qMod+rnd(-6,6)+(has('flair')?3:0);
  p.quality=Math.round(clamp(q,5,99));
  const star=p.cast.reduce((s,a)=>s+a.star,0)/p.cast.length;
  p.starPower=clamp(star*.45+p.dir.star*.1+p.hypeMod,0,70);
}
const hypeFor=(p,mkt)=>clamp(p.starPower+45*(has('mkt')?1.15:1)*(1-Math.exp(-mkt/(5000+p.cost*.5))),0,100);
const perScreen1=(p,w,hype)=>3000*Math.pow(p.quality/60,1.6)*(.45+hype/90)*GENRES[p.genre].appeal*season(p.genre,w)*compFactor(w);
function audience(p){
  const r=Math.random();let f=r<.12?rnd(.35,.6):r>.9?rnd(1.3,1.7):rnd(.8,1.2);
  const same=S.projects.filter(x=>x!==p&&x.genre===p.genre&&x.run&&x.run.length&&S.week-x.run[0].w<26).length;
  f*=Math.pow(.85,same);p.fatigue=same;p.reaction=f;
  if(f<.65)addLog(`Le public boude « ${p.title} » : le bouche-à-oreille est mauvais.`);else if(f>1.25)addLog(`Le public adore « ${p.title} » : la file s'allonge devant les salles.`);
  if(same)addLog(`Lassitude : tu as déjà sorti ${same} film${same>1?'s':''} ${p.genre.toLowerCase()} ces derniers mois.`);
  return f;}
const decay=q=>.42+q/220;
const critic=q=>(q/10).toFixed(1).replace('.',',');

function makeIncident(p){
  const d=pick(INC),wk=BUDGETS[p.budget].w;
  return{t:d.t,d:d.d.replace('{A}',pick(p.cast).name).replace('{D}',p.dir.name),
    o:d.o.map(o=>({l:o.l,weeks:o.weeks||0,q:o.q||0,hype:o.hype||0,cost:o.costF?Math.max(1500,Math.round(o.costF*wk*3/100)*100):0}))};
}
function effects(o){
  const e=[];if(o.cost)e.push(eur(o.cost));if(o.weeks)e.push('+'+o.weeks+' sem. de tournage');
  if(o.q)e.push((o.q>0?'+':'−')+Math.abs(o.q)+' qualité');if(o.hype)e.push((o.hype>0?'+':'−')+Math.abs(o.hype)+' buzz');
  return e.length?e.join(' · '):'Aucun effet';
}
function resolveIncident(pid,i){
  const p=proj(pid),o=p.incident.o[i];
  if(o.cost){pay(-o.cost,`Imprévu « ${p.title} » : ${p.incident.t}`);p.cost+=o.cost}
  p.extraWeeks+=o.weeks;p.qMod+=o.q;p.hypeMod+=o.hype;
  addLog(`« ${p.title} » — ${p.incident.t} : ${o.l.toLowerCase()}.`);
  p.incident=null;
}

function boxWeek(p){
  const n=p.run.length,prev=p.run[n-1];
  const screens=n===0?p.release.screens:Math.max(10,Math.round(prev.screens*(p.quality<50?.8:p.quality<70?.9:.95)));
  const per=(n===0?p.per1:prev.gross/prev.screens*decay(p.quality)*rnd(.95,1.05))*(p.boost||1);p.boost=1;
  const gross=Math.round(screens*per),own=Math.min(ownScreens(),screens),share=Math.round(gross*(.5+.5*own/screens));S.yGross+=gross;
  p.run.push({w:S.week,screens,gross});p.revenue+=share;
  pay(share,`Recettes salles « ${p.title} » (sem. ${n+1})`);
  if(n===0){addLog(`« ${p.title} » démarre avec ${eur(gross)} au box-office.`);trophy('first');if((p.seqN||1)>=3)trophy('franchise')}
  if(n>=11||gross<4000){
    p.stage='termine';p.outWeek=S.week;p.gross=p.run.reduce((t,r)=>t+r.gross,0);p.after={intl:{s:'',n:0},stream:{s:'',n:0},tv:{s:'',n:0}};
    checkRecords(p);if(p.gross>=1e6)trophy('m1');if(p.gross>=1e7)trophy('m10');if(p.gross>=1e8)trophy('m100');
    {const ok=p.revenue>p.cost;
     [p.dir,...p.cast].forEach(t=>{const x=[...S.directors,...S.actors].find(z=>z.id===t.id);if(!x)return;
       x.talent=Math.min(99,x.talent+(x.contract?ri(2,5):ri(1,3)));
       if(ok){x.star=Math.min(100,x.star+ri(3,7));x.fee=r500(x.fee*1.25)}else x.star=Math.max(0,x.star-3);});
     if(ok){trophy('profit');addLog(`Après ce succès, l'équipe de « ${p.title} » demande des cachets plus élevés.`)}}
    const profit=p.revenue-p.cost;
    const dRep=Math.round((p.quality-50)/6+(profit>0?Math.min(6,profit/p.cost*4):-2));
    S.rep=clamp(S.rep+dRep,0,100);
    addLog(`« ${p.title} » quitte l'affiche : ${profit>=0?'bénéfice':'perte'} de ${eur(Math.abs(profit))}. Réputation ${dRep>=0?'+':''}${dRep}.`);
  }
}

function nextWeek(){
  if(S.projects.some(p=>p.incident)){toast('Règle d\'abord les imprévus de tournage.');tab='home';render();return}
  S.week++;
  weekCompta();
  pay(-fraisNow(),'Frais de structure (loyer, équipe fixe)',{tva:false});
  {const used=Math.min(ownScreens(),S.projects.filter(p=>p.stage==='salles').reduce((t,p)=>t+p.run[p.run.length-1].screens,0)),free=ownScreens()-used;
   if(free>0)pay(free*SCREEN_INCOME,`Exploitation de tes salles (${free} écrans programmant d'autres films)`);}
  weekPerso();
  for(const p of S.projects){
    if(p.stage==='tournage'){
      const c=BUDGETS[p.budget].w;pay(-c,`Tournage « ${p.title} »`);p.cost+=c;p.progress++;
      if(p.progress>=p.weeks+p.extraWeeks){
        p.stage='postprod';p.post=0;
        [p.dir,...p.cast].forEach(t=>{const x=[...S.directors,...S.actors].find(z=>z.id===t.id);if(x)x.busy=0});
        addLog(`Clap de fin pour « ${p.title} ». Direction la salle de montage.`);
      }else if(Math.random()<(has('plateau')?.17:.28))p.incident=makeIncident(p);
    }else if(p.stage==='postprod'){
      p.post++;
      if(p.post>=2){finalizeQuality(p);p.stage='pret';addLog(`« ${p.title} » est prêt. Projection test : ${critic(p.quality)}/10.`)}
    }else if(p.stage==='programme'&&p.release.week===S.week){
      p.stage='salles';p.per1=perScreen1(p,S.week,p.hype)*audience(p);p.run=[];boxWeek(p);
    }else if(p.stage==='salles'){boxWeek(p)}
  }
  weekAfter();weekFests();
  if(S.week-S.marketWeek>=4){refreshMarket();addLog('De nouveaux scénarios sont arrivés sur ton bureau.')}
  {const g=Math.pow(1.12,dateOf(S.week).y-2027);S.comps.filter(c=>c.week===S.week).forEach(c=>S.rivals[c.studio]=(S.rivals[c.studio]||0)+Math.round(c.force*c.force*2000*g*rnd(.6,1.4)));}
  ensureComps();
  S.cashHist.push(S.cash);if(S.cashHist.length>52)S.cashHist.shift();
  if(S.projects.some(p=>p.incident))tab='home';
  save();render();
}

const TABS=[['home','Accueil'],['projets','Films'],['box','Box-office'],['studio','Studio'],['fin','Finances']];

function render(){
  document.getElementById('date').textContent=dateLabel(S.week)+' · '+TIERS[S.tier].n;
  document.getElementById('stats').innerHTML=
    `<div><span>Trésorerie </span><strong class="${S.cash<0?'neg':''}">${eur(S.cash)}</strong></div>
     <div><span>Réputation </span><strong>${S.rep}/100</strong></div>
     <div><span>Plateaux libres </span><strong>${freePlateaux()}/${TIERS[S.tier].plat}</strong></div>`;
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>
    `<button data-a="tab" data-id="${k}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join('');
  const v=document.getElementById('view');
  v.innerHTML={home:viewHome,projets:viewProjets,box:viewBox,studio:viewStudio,fin:viewFin,moi:viewMoi}[tab]();
}

function projCard(p){
  const [lab,cls]=STAGES[p.stage];let body='';
  if(p.stage==='tournage'){const tot=p.weeks+p.extraWeeks;body=`<div class="row"><span class="muted">Semaine ${p.progress}/${tot} · ${eur(BUDGETS[p.budget].w)}/sem.</span></div><div class="bar"><i style="width:${p.progress/tot*100}%"></i></div>`}
  else if(p.stage==='postprod')body=`<div class="muted">Montage et mixage : semaine ${p.post+1}/2</div><div class="bar"><i style="width:${(p.post)/2*100}%"></i></div>`;
  else if(p.stage==='pret')body=`<div class="row"><span>Projection test <strong class="num">${critic(p.quality)}/10</strong></span><span class="muted">Coût engagé ${eur(p.cost)}</span></div><button class="btn primary" data-a="release" data-id="${p.id}">Planifier la sortie</button>`;
  else if(p.stage==='programme')body=`<div class="muted">Sortie le ${dateLabel(p.release.week)} · ${p.release.screens} salles · buzz ${Math.round(p.hype)}/100</div>`;
  else if(p.stage==='salles'){const l=p.run[p.run.length-1];body=`<div class="kv"><dt>Semaine ${p.run.length}</dt><dd>${eur(l.gross)}</dd><dt>Salles</dt><dd>${l.screens}</dd><dt>Part studio cumulée</dt><dd>${eur(p.revenue)}</dd></div>`}
  return `<div class="card"><div class="row"><span class="chip">${p.genre}</span><span class="chip ${cls}">${lab}</span></div>
    <div class="film-title">${esc(p.title)}</div><div class="muted" style="font-size:13px">Réal. ${esc(p.dir.name)} · avec ${p.cast.map(a=>esc(a.name)).join(', ')}</div>${body}</div>`;
}

  const inc=S.projects.filter(p=>p.incident);

  if(inc.length)h+=`<section class="sec"><h2>Sur le plateau</h2>${inc.map(p=>`<div class="card inc"><span class="label">Imprévu · ${esc(p.title)}</span><h3>${p.incident.t}</h3><div>${esc(p.incident.d)}</div>
    <div class="btns">${p.incident.o.map((o,i)=>`<button class="btn" data-a="inc" data-id="${p.id}" data-i="${i}"><div>${o.l}</div><div class="muted" style="font-size:12px;font-weight:500">${effects(o)}</div></button>`).join('')}</div></div>`).join('')}</section>`;
  h+=homeAdmin();
  const ready=S.projects.filter(p=>p.stage==='pret');
  if(ready.length)h+=`<section class="sec"><h2>À sortir</h2>${ready.map(projCard).join('')}</section>`;
  if(!active.length)h+=`<section class="sec"><h2>Silence plateau</h2><div class="card"><div>Aucun film en cours. Choisis un scénario, engage un réalisateur et des acteurs, puis lance le tournage.</div><button class="btn primary" data-a="wizard">Monter un nouveau film</button></div></section>`;
  else if(freePlateaux()>0)h+=`<button class="btn primary" data-a="wizard">Monter un nouveau film (${freePlateaux()} plateau libre)</button>`;
  h+=`<section class="sec"><h2>Journal du studio</h2><div class="card log">${S.log.slice(0,10).map(l=>`<div><span>S${dateOf(l.w).wk}</span>${esc(l.txt)}</div>`).join('')}</div></section>`;
  return h;
}

  const run=S.projects.filter(p=>p.stage==='salles'),prog=S.projects.filter(p=>p.stage==='programme'),done=S.projects.filter(p=>p.stage==='termine');

  h+=`</section>`;
  if(prog.length)h+=`<section class="sec"><h2>Sorties programmées</h2>${prog.map(projCard).join('')}</section>`;
  h+=`<section class="sec"><h2>Concurrence à venir</h2><div class="card">${up.map(c=>`<div class="row"><div style="min-width:0"><strong>${esc(c.title)}</strong><div class="muted" style="font-size:12px">${c.studio} · ${c.genre} · ${dateLabel(c.week)}</div></div><span class="chip ${c.force>70?'bad':c.force>40?'gold':''}">${c.force>70?'Gros film':c.force>40?'Moyen':'Petit'}</span></div>`).join('')}</div></section>`;

    <div class="meters"><span>Réputation</span><div class="bar"><i style="width:${Math.min(100,S.rep/N.rep*100)}%"></i></div><span class="num">${S.rep}/${N.rep}</span><span>Trésorerie</span><div class="bar"><i style="width:${clamp(S.cash/N.cost*100,0,100)}%"></i></div><span class="num">${Math.round(clamp(S.cash/N.cost*100,0,100))} %</span></div>

  return h;
}

function viewFin(){
  const h=S.cashHist,max=Math.max(1,...h.map(Math.abs));
  const recent=S.ledger.filter(l=>l.w>S.week-4);
  const inn=recent.filter(l=>l.amt>0).reduce((s,l)=>s+l.amt,0),out=recent.filter(l=>l.amt<0).reduce((s,l)=>s+l.amt,0);
  return `<section class="sec"><h2>Trésorerie</h2><div class="card"><div class="film-title num ${S.cash<0?'neg':''}">${eur(S.cash)}</div>
    <div class="chart" aria-label="Trésorerie des dernières semaines">${h.map(v=>`<i class="${v<0?'n':''}" style="height:${v<0?6:Math.max(2,v/max*100)}%"></i>`).join('')}</div>

/* ---------- Assistant : monter un film ---------- */
function openWizard(){if(freePlateaux()<1){toast('Aucun plateau libre.');return}W={step:0,script:null,dir:null,cast:[],budget:0,weeks:4};renderSheet()}
function wizCosts(){
  const s=S.scripts.find(x=>x.id===W.script),d=S.directors.find(x=>x.id===W.dir);
  const now=(s?s.price:0)+(d?feeOf(d):0)+W.cast.reduce((t,id)=>t+feeOf(S.actors.find(a=>a.id===id)),0);
  return{now,weekly:BUDGETS[W.budget].w,total:now+BUDGETS[W.budget].w*W.weeks};
}
function meters(t){return `<div class="meters"><span>Talent</span><div class="bar"><i style="width:${t.talent}%"></i></div><span class="num">${t.talent}</span><span>Notoriété</span><div class="bar"><i style="width:${t.star}%"></i></div><span class="num">${t.star}</span></div>`}
function renderSheet(){
  const el=document.getElementById('sheet');
  if(!W&&!R){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;
  if(R){el.innerHTML=releaseSheet();return}
  const steps=['Scénario','Réalisation','Casting','Production'];
  let body='',ok=false;
  if(W.step===0){body=S.scripts.map(s=>`<button class="opt" data-a="w-script" data-id="${s.id}" aria-pressed="${W.script===s.id}"><div class="row" style="width:100%"><span class="chip ${s.sequelOf?'gold':''}">${s.sequelOf?'Suite · ':''}${s.genre}</span><span class="num">${eur(s.price)}</span></div><h3>${esc(s.title)}</h3><div class="meters" style="width:100%"><span>Écriture</span><div class="bar"><i style="width:${s.quality}%"></i></div><span class="num">${s.quality}</span></div></button>`).join('');ok=!!W.script}
  if(W.step===1){body=S.directors.filter(d=>!d.busy).sort((a,b)=>!!b.contract-!!a.contract||a.fee-b.fee).map(d=>`<button class="opt" data-a="w-dir" data-id="${d.id}" aria-pressed="${W.dir===d.id}"><div class="row" style="width:100%"><h3>${esc(d.name)}${d.contract?' <span class="chip gold">Sous contrat</span>':''}</h3><span class="num">${eur(feeOf(d))}</span></div>${meters(d)}</button>`).join('');ok=!!W.dir}
  if(W.step===2){body=`<div class="muted" style="font-size:13px">Choisis 1 ou 2 rôles principaux (${W.cast.length}/2).</div>`+S.actors.filter(a=>!a.busy).sort((a,b)=>!!b.contract-!!a.contract||a.fee-b.fee).map(a=>`<button class="opt" data-a="w-act" data-id="${a.id}" aria-pressed="${W.cast.includes(a.id)}" ${!W.cast.includes(a.id)&&W.cast.length>=2?'disabled':''}><div class="row" style="width:100%"><h3>${esc(a.name)}${a.contract?' <span class="chip gold">Sous contrat</span>':''}</h3><span class="num">${eur(feeOf(a))}</span></div>${meters(a)}</button>`).join('');ok=W.cast.length>0}
  if(W.step===3){
    const c=wizCosts(),s=S.scripts.find(x=>x.id===W.script),heavy=GENRES[s.genre].heavy;
    body=`<div class="label">Budget de tournage</div><div class="choices">${BUDGETS.map((b,i)=>`<button data-a="w-bud" data-id="${i}" aria-pressed="${W.budget===i}" ${b.t>S.tier?'disabled':''}>${b.k}<small>${eur(b.w)}/sem.${b.t>S.tier?' · '+TIERS[b.t].n:''}</small></button>`).join('')}</div>
    <div class="muted" style="font-size:13px">${heavy?`Un film ${s.genre.toLowerCase()} dépend beaucoup des moyens de production.`:`En ${s.genre.toLowerCase()}, le scénario et les acteurs comptent plus que le budget.`}</div>
    <div class="label">Durée du tournage</div><div class="stepper"><button data-a="w-wk" data-id="-1" aria-label="Moins">−</button><strong>${W.weeks}</strong><span class="muted">semaines${W.weeks<4?' · tournage bâclé':W.weeks>=8?' · soin du détail':''}</span><button data-a="w-wk" data-id="1" aria-label="Plus">+</button></div>
    <div class="card"><dl class="kv"><dt>Payé maintenant (scénario + cachets)</dt><dd>${eur(c.now)}</dd><dt>Tournage, payé chaque semaine</dt><dd>${eur(c.weekly)} × ${W.weeks}</dd><dt>Coût de production</dt><dd>${eur(c.total)}</dd><dt>Trésorerie après signature</dt><dd class="${S.cash-c.now<0?'neg':''}">${eur(S.cash-c.now)}</dd></dl></div>`;
    ok=S.cash>=c.now;
    if(!ok)body+=`<div class="neg" style="font-size:14px">Pas assez de trésorerie pour signer les contrats.</div>`;
  }
  el.innerHTML=`<div class="veil" data-a="veil"><div class="sheet" role="dialog" aria-label="Monter un film">
    <div class="sheet-head"><div class="grow"><div class="label">Étape ${W.step+1}/4</div><h2>${steps[W.step]}</h2></div><button class="x" data-a="close" aria-label="Fermer">×</button></div>
    <div class="steps" style="padding:0 16px">${steps.map((_,i)=>`<i class="${i<=W.step?'on':''}"></i>`).join('')}</div>
    <div class="sheet-body">${body}</div>
    <div class="sheet-foot"><div class="btns">${W.step>0?'<button class="btn" data-a="w-back">Retour</button>':''}<button class="btn primary" data-a="${W.step<3?'w-next':'w-go'}" ${ok?'':'disabled'}>${W.step<3?'Continuer':'Lancer le tournage'}</button></div></div>
  </div></div>`;
}
function launchFilm(){
  const s=S.scripts.find(x=>x.id===W.script),d=S.directors.find(x=>x.id===W.dir),cast=W.cast.map(id=>S.actors.find(a=>a.id===id));
  const c=wizCosts();if(S.cash<c.now||freePlateaux()<1)return;
  pay(-s.price,`Droits du scénario « ${s.title} »`);pay(-feeOf(d),`Cachet réalisation ${d.name}`);cast.forEach(a=>pay(-feeOf(a),`Cachet ${a.name}`));
  d.busy=1;cast.forEach(a=>a.busy=1);
  [d,...cast].forEach(t=>{if(t.contract){t.contract.left--;if(t.contract.left<=0){delete t.contract;addLog(`Le contrat de ${t.name} est arrivé à son terme.`)}}});
  S.projects.push({id:nid(),title:s.title,genre:s.genre,scriptQ:s.quality,dir:{id:d.id,name:d.name,talent:d.talent,star:d.star},cast:cast.map(a=>({id:a.id,name:a.name,talent:a.talent,star:a.star})),
    budget:W.budget,weeks:W.weeks,stage:'tournage',progress:0,extraWeeks:0,qMod:0,hypeMod:s.sequelOf?s.fans:0,sequel:!!s.sequelOf,seqN:s.seqN||1,cost:c.now,revenue:0,incident:null,post:0,release:null,run:[]});
  S.scripts=S.scripts.filter(x=>x.id!==s.id);
  addLog(`Premier clap pour « ${s.title} », réalisé par ${d.name}.`);
  W=null;tab='projets';save();renderSheet();render();toast('Tournage lancé');
}

/* ---------- Sortie en salles ---------- */
function openRelease(id){const p=proj(id);R={id,off:2,screens:Math.min(150,TIERS[S.tier].screens),mv:30};renderSheet()}
const mktOf=v=>Math.round(TIERS[S.tier].mkt*Math.pow(v/100,2)/1000)*1000;
function releaseSheet(){
  const p=proj(R.id),T=TIERS[S.tier],w=S.week+R.off,mkt=mktOf(R.mv);
  const weeks=Array.from({length:8},(_,i)=>{const ww=S.week+i+1,l=compLoad(ww),se=season(p.genre,ww);
    return `<button data-a="r-wk" data-id="${i+1}" aria-pressed="${R.off===i+1}">${dateLabel(ww).replace('Sem. ','S')}<small>${l>140?'Concurrence forte':l>70?'Concurrence moyenne':'Concurrence faible'}${se>1?' · saison +'+Math.round((se-1)*100)+' %':''}</small></button>`}).join('');
  const rivals=S.comps.filter(c=>c.week>=w-2&&c.week<=w);
  return `<div class="veil" data-a="veil"><div class="sheet" role="dialog" aria-label="Planifier la sortie">
    <div class="sheet-head"><div class="grow"><div class="label">Sortie · ${p.genre} · test ${critic(p.quality)}/10</div><h2>${esc(p.title)}</h2></div><button class="x" data-a="close" aria-label="Fermer">×</button></div>
    <div class="sheet-body">
      <div class="label">Date de sortie</div><div class="choices">${weeks}</div>
      <div class="muted" style="font-size:13px">Face à toi : ${rivals.length?rivals.map(c=>esc(c.title)+' ('+c.studio+')').join(', '):'aucun concurrent'}.</div>
      <div class="label">Nombre de salles · <span class="num" id="r-scr-l">${R.screens}</span></div>
      <input type="range" id="r-screens" min="20" max="${T.screens}" step="10" value="${R.screens}" aria-label="Nombre de salles">
      <div class="muted" style="font-size:13px">${eur(SCREEN_COST)} par salle (copies et distribution).</div>
      <div class="label">Budget marketing · <span class="num" id="r-mkt-l">${eur(mkt)}</span></div>
      <input type="range" id="r-mkt" min="0" max="100" step="1" value="${R.mv}" aria-label="Budget marketing">
      <div class="card" id="r-sum">${relSummary(p).html}</div>
      <div class="muted" style="font-size:12px">Estimations : le public peut te surprendre dans les deux sens. Les salles gardent 50 % des recettes.</div>
    </div>
    <div class="sheet-foot" id="r-foot">${relSummary(p).foot}</div>
  </div></div>`;
}
function relSummary(p){
  const w=S.week+R.off,mkt=mktOf(R.mv),hype=hypeFor(p,mkt),wk1=perScreen1(p,w,hype)*R.screens*.5;
  const d=decay(p.quality),sd=p.quality<50?.8:p.quality<70?.9:.95,total=wk1/(1-d*sd),cost=R.screens*SCREEN_COST+mkt,res=total-cost-p.cost;
  return{html:`<dl class="kv"><dt>Buzz attendu</dt><dd>${Math.round(hype)}/100</dd><dt>Part studio 1re semaine</dt><dd>≈ ${eur(wk1)}</dd><dt>Part studio sur l'exploitation</dt><dd>≈ ${eur(total)}</dd><dt>Coût de la sortie</dt><dd>${eur(cost)}</dd><dt>Déjà investi</dt><dd>${eur(p.cost)}</dd><dt>Résultat estimé</dt><dd class="${res>=0?'pos':'neg'}">${eur(res)}</dd></dl>`,
    foot:`<button class="btn primary" data-a="r-go" ${S.cash>=cost?'':'disabled'}>${S.cash>=cost?'Confirmer la sortie · '+eur(cost):'Trésorerie insuffisante ('+eur(cost)+')'}</button>`};
}
function confirmRelease(){
  const p=proj(R.id),mkt=mktOf(R.mv),cost=R.screens*SCREEN_COST+mkt;if(S.cash<cost)return;
  p.hype=hypeFor(p,mkt);
  pay(-R.screens*SCREEN_COST,`Copies et distribution « ${p.title} » (${R.screens} salles)`);if(mkt)pay(-mkt,`Campagne marketing « ${p.title} »`);
  p.cost+=cost;p.release={week:S.week+R.off,screens:R.screens,mkt};p.stage='programme';
  addLog(`« ${p.title} » sortira le ${dateLabel(p.release.week)} dans ${R.screens} salles.`);
  R=null;save();renderSheet();render();toast('Sortie programmée');
}


/* ---------- Vie après les salles ---------- */
function weekAfter(){
  for(const p of S.projects.filter(p=>p.after)){
    for(const ch of ['intl','stream','tv']){
      const a=p.after[ch];
      if(a.s==='offre'&&S.week>a.exp){a.s='';addLog(`L'offre ${CHANNELS[ch].n.toLowerCase()} pour « ${p.title} » a expiré.`)}
      if(a.s===''&&a.n<5&&(ch!=='tv'||S.week-p.outWeek>=8)&&Math.random()<.3){
        const base={intl:p.gross*.12*GENRES[p.genre].appeal,stream:p.gross*.15+p.quality*400,tv:p.gross*.07+p.quality*200}[ch]*(p.prize?1.3:1);
        Object.assign(a,{s:'offre',amt:Math.max(2000,Math.round(base*rnd(.6,1.4)/500)*500),exp:S.week+3,buyer:pick(CHANNELS[ch].buyers)});a.n++;
      }
      if(a.s===''&&a.n>=5)a.s='fini';
    }
  }
}
function acceptOffer(id,ch){
  const p=proj(id),a=p.after[ch];if(a.s!=='offre')return;
  pay(a.amt,`Droits ${CHANNELS[ch].n.toLowerCase()} « ${p.title} » (${a.buyer})`);p.revenue+=a.amt;a.s='vendu';
  addLog(`Droits ${CHANNELS[ch].n.toLowerCase()} de « ${p.title} » vendus à ${a.buyer} pour ${eur(a.amt)}.`);
}
function refuseOffer(id,ch){const a=proj(id).after[ch];a.s='';}
function offerCard(p,ch){const a=p.after[ch];
  return `<div class="card"><span class="label">${CHANNELS[ch].n} · expire ${dateLabel(a.exp)}</span><h3>${esc(p.title)}</h3><div>${a.buyer[0].toUpperCase()+a.buyer.slice(1)} propose <strong class="num">${eur(a.amt)}</strong> HTVA.</div>
  <div class="btns"><button class="btn primary" data-a="offer-ok" data-id="${p.id}" data-i="${ch}">Accepter</button><button class="btn" data-a="offer-no" data-id="${p.id}" data-i="${ch}">Attendre mieux</button></div></div>`}
function viewCatalogue(){
  const cat=S.projects.filter(p=>p.after);
  if(!cat.length)return '';
  return `<section class="sec"><h2>Catalogue</h2><div class="muted" style="font-size:13px">Après les salles, tes films se vendent à l'étranger, en streaming puis à la télévision (8 semaines après la sortie des salles).</div>${cat.slice().reverse().map(p=>{
    const st=ch=>{const a=p.after[ch];return a.s==='vendu'?`<span class="chip good">Vendu ${eur(a.amt)}</span>`:a.s==='offre'?`<span class="chip gold">Offre ${eur(a.amt)}</span>`:a.s==='fini'?'<span class="chip">Plus d\'acheteur</span>':'<span class="chip">En attente</span>'};
    const canSeq=!p.sequel&&!p.hasSequel&&p.quality>=55&&p.revenue>p.cost;
    return `<div class="card"><div class="row"><h3>${esc(p.title)}</h3>${p.prize?'<span class="chip gold">Primé</span>':''}</div>
    ${['intl','stream','tv'].map(ch=>`<div class="row"><span class="muted">${CHANNELS[ch].n}</span>${st(ch)}</div>`).join('')}
    ${['intl','stream','tv'].filter(ch=>p.after[ch].s==='offre').map(ch=>`<div class="btns"><button class="btn primary" data-a="offer-ok" data-id="${p.id}" data-i="${ch}">Accepter ${CHANNELS[ch].n.toLowerCase()}</button><button class="btn" data-a="offer-no" data-id="${p.id}" data-i="${ch}">Attendre mieux</button></div>`).join('')}
    ${canSeq?`<button class="btn" data-a="sequel" data-id="${p.id}">Lancer une suite</button>`:''}</div>`}).join('')}</section>`;

/* ---------- Suites ---------- */
function startSequel(id){
  const p=proj(id);if(freePlateaux()<1){toast('Aucun plateau libre.');return}
  const m=p.title.match(/ (\d+)$/),title=m?p.title.replace(/ \d+$/,' '+(+m[1]+1)):p.title+' 2';
  const q=clamp(p.scriptQ+ri(-8,4),10,97);
  const sc={id:nid(),title,genre:p.genre,quality:q,price:r500((1000+q*q*2)*(1+S.tier*.8)*1.5),sequelOf:p.id,seqN:(p.seqN||1)+1,fans:Math.round(clamp(8+p.gross/60000,8,25))};
  S.scripts.unshift(sc);p.hasSequel=true;
  addLog(`Un scénariste écrit la suite : « ${title} ». Les fans du premier attendent déjà.`);
  W={step:0,script:sc.id,dir:null,cast:[],budget:0,weeks:4};save();renderSheet();
}

/* ---------- Festivals ---------- */
function festNext(){const wk=dateOf(S.week).wk;return FESTS.map((f,i)=>{let w=S.week-wk+f.wk;if(w<=S.week)w+=52;return{...f,i,w}}).sort((a,b)=>a.w-b.w)}
function eligible(f){return S.projects.filter(p=>p.quality!=null&&!(p.stage==='termine'&&S.week-p.outWeek>30)&&!S.subs.some(x=>x.pid===p.id&&x.i===f.i&&x.w===f.w))}
function submitFest(pid,i){
  const f=festNext().find(x=>x.i===i),p=proj(pid);if(!f||S.cash<f.fee)return;
  pay(-f.fee,`Inscription « ${p.title} » au ${f.n}`);p.cost+=f.fee;
  S.subs.push({pid,i,w:f.w});addLog(`« ${p.title} » est inscrit au ${f.n}.`);
}
function weekFests(){
  for(const x of S.subs.filter(x=>x.w===S.week)){
    const p=proj(x.pid),f=FESTS[x.i];if(!p)continue;
    if(Math.random()<clamp((p.quality-f.min+15)/30,.05,.95)){
      S.rep=clamp(S.rep+2,0,100);trophy('sel');
      if(p.stage==='pret'||p.stage==='tournage'||p.stage==='postprod')p.starPower=clamp(p.starPower+10,0,80);
      else if(p.stage==='programme')p.hype=clamp(p.hype+10,0,100);
      else if(p.stage==='salles')p.boost=1.15;
      if(Math.random()<clamp((p.quality-75)/25,0,.8)){p.prize=true;S.rep=clamp(S.rep+5,0,100);trophy('prix');if(p.stage==='salles')p.boost=1.3;addLog(`« ${p.title} » remporte un prix au ${f.n} ! Réputation +7.`)}
      else addLog(`« ${p.title} » est sélectionné au ${f.n}. Réputation +2, le buzz grimpe.`);
    }else addLog(`« ${p.title} » n'a pas été retenu au ${f.n}.`);
  }
  S.subs=S.subs.filter(x=>x.w>S.week-60);
}
function viewFests(){
  return `<section class="sec"><h2>Festivals</h2>${festNext().slice(0,2).map(f=>{const el=eligible(f),subs=S.subs.filter(x=>x.i===f.i&&x.w===f.w);
    return `<div class="card"><div class="row"><h3>${f.n}</h3><span class="chip">${dateLabel(f.w)}</span></div><div class="muted" style="font-size:13px">${f.d}. Inscription ${eur(f.fee)} HTVA. Une projection test autour de ${critic(f.min)}/10 donne une chance sur deux d'être sélectionné.</div>
    ${subs.map(x=>`<div class="row"><span>${esc(proj(x.pid).title)}</span><span class="chip good">Inscrit</span></div>`).join('')}
    ${el.length?`<div class="choices">${el.map(p=>`<button data-a="fest" data-id="${p.id}" data-i="${f.i}" ${S.cash<f.fee?'disabled':''}>${esc(p.title)}<small>test ${critic(p.quality)}/10</small></button>`).join('')}</div>`:(subs.length?'':'<div class="muted" style="font-size:13px">Il te faut un film terminé (au moins en post-production achevée) pour l\'inscrire.</div>')}</div>`}).join('')}</section>`;
}

/* ---------- Compta belge ---------- */
function quarterOf(w){const d=dateOf(w);return {q:Math.ceil(d.wk/13),y:d.y}}
function weekCompta(){
  const d=dateOf(S.week);
  if([1,14,27,40].includes(d.wk)&&S.week>1){
    const pq=quarterOf(S.week-1);
    S.tvaDecl={label:`T${pq.q} ${pq.y}`,...S.tq,due:S.week+3};S.tq={out:0,ded:0,b03:0,b82:0};
    addLog(`La déclaration TVA du T${pq.q} ${pq.y} est à déposer avant le ${dateLabel(S.week+3)}.`);
  }
  if(S.tvaDecl&&S.week>S.tvaDecl.due){pay(-250,'Amende administrative TVA (retard)',{k:'tax'});}
  if(d.wk===1&&S.week>1){
    {const y=d.y-1,tab=rankTable(),pos=tab.findIndex(r=>r.me)+1;S.hist.unshift({y,pos,g:S.yGross});
     addLog(`Classement ${y} : tu termines ${pos===1?'1er':pos+'e'} du box-office avec ${eur(S.yGross)}.`);
     if(pos===1){S.n1++;trophy('n1');if(S.n1>=3)trophy('legende')}
     Object.keys(S.rivals).forEach(k=>S.rivals[k]=0);S.yGross=0;
     [...S.directors,...S.actors].forEach(t=>t.fee=r500(t.fee*1.04));}
    const y=S.yr.y,amort=S.assets.filter(a=>dateOf(a.w).y>y-5&&dateOf(a.w).y<=y).reduce((t,a)=>t+a.c/5,0);
    const res=Math.round(S.yr.rev-S.yr.exp-amort),isoc=res>0?Math.round(Math.min(res,100000)*.2+Math.max(0,res-100000)*.25):0;
    if(isoc)pay(-isoc,`Impôt des sociétés ${y}`,{k:'tax'});
    S.closing={y,rev:Math.round(S.yr.rev),exp:Math.round(S.yr.exp),amort:Math.round(amort),res,isoc,net:res-isoc};
    S.yr={y:d.y,rev:0,exp:0};S.me.rate=+rnd(2,7).toFixed(1);
    addLog(`Clôture de l'exercice ${y} : résultat ${eur(res)}, impôt des sociétés ${eur(isoc)}.`);
  }
}
function fileTva(){const t=S.tvaDecl,net=t.out-t.ded;
  pay(-net,`Déclaration TVA ${t.label} : ${net>=0?'TVA payée':'TVA remboursée'}`,{k:'tva'});
  addLog(`Déclaration TVA ${t.label} déposée.`);S.tvaDecl=null;}
function payDividend(pct){const c=S.closing,gross=Math.round(Math.max(0,Math.min(c.net,S.cash))*pct/100);
  if(gross>0){pay(-gross,`Dividende brut exercice ${c.y}`,{k:'cap'});const net=Math.round(gross*.7);S.me.cash+=net;addLog(`Dividende de ${eur(gross)} brut : ${eur(net)} net pour toi après précompte mobilier de 30 %.`)}
  else addLog(`Pas de dividende pour ${c.y} : le bénéfice reste dans le studio.`);
  S.closing=null;}
function tvaGrid(t){const net=t.out-t.ded;return `<dl class="kv"><dt>Grille 03 · ventes à 21 %</dt><dd>${eur(t.b03)}</dd><dt>Grille 82 · achats et services</dt><dd>${eur(t.b82)}</dd><dt>Grille 54 · TVA due</dt><dd>${eur(t.out)}</dd><dt>Grille 59 · TVA déductible</dt><dd>${eur(t.ded)}</dd><dt>${net>=0?'Grille 71 · à payer':'Grille 72 · à récupérer'}</dt><dd class="${net>=0?'neg':'pos'}">${eur(Math.abs(net))}</dd></dl>`}
function closingCard(){const c=S.closing;return `<div class="card inc"><span class="label">Clôture de l'exercice ${c.y}</span><dl class="kv"><dt>Produits</dt><dd>${eur(c.rev)}</dd><dt>Charges</dt><dd>${eur(c.exp)}</dd><dt>Amortissements</dt><dd>${eur(c.amort)}</dd><dt>Résultat avant impôt</dt><dd>${eur(c.res)}</dd><dt>Impôt des sociétés (20 % puis 25 %)</dt><dd>${eur(c.isoc)}</dd><dt>Bénéfice après impôt</dt><dd class="${c.net>=0?'pos':'neg'}">${eur(c.net)}</dd></dl>
  ${c.net>0?`<div class="muted" style="font-size:13px">L'assemblée générale décide du dividende. Précompte mobilier : 30 %.</div><div class="choices">${[0,25,50,100].map(x=>`<button data-a="div" data-id="${x}">${x?x+' %':'Aucun'}<small>${x?eur(Math.max(0,Math.min(c.net,S.cash))*x/100)+' brut':'tout en réserve'}</small></button>`).join('')}</div>`:`<button class="btn" data-a="div" data-id="0">Reporter la perte et fermer</button>`}</div>`}
function homeAdmin(){let h='';
  if(S.tvaDecl)h+=`<div class="card inc"><span class="label">TVA · à déposer avant le ${dateLabel(S.tvaDecl.due)}</span><h3>Déclaration ${S.tvaDecl.label}</h3>${tvaGrid(S.tvaDecl)}${S.week>S.tvaDecl.due?'<div class="neg" style="font-size:13px">En retard : 250 € d\'amende par semaine.</div>':''}<button class="btn primary" data-a="tva">Déposer la déclaration</button></div>`;
  if(S.closing)h+=closingCard();
  const offers=S.projects.filter(p=>p.after).flatMap(p=>['intl','stream','tv'].filter(ch=>p.after[ch].s==='offre').map(ch=>offerCard(p,ch)));
  if(offers.length)h+=`<section class="sec"><h2>Offres de droits</h2>${offers.join('')}</section>`;
  return h?`<section class="sec">${h}</section>`:'';
}
function viewCompta(){const y=S.yr,res=y.rev-y.exp;
  return `<section class="sec"><h2>Exercice ${y.y}</h2><div class="card"><dl class="kv"><dt>Produits (HTVA)</dt><dd>${eur(y.rev)}</dd><dt>Charges (HTVA)</dt><dd>${eur(y.exp)}</dd><dt>Résultat provisoire</dt><dd class="${res>=0?'pos':'neg'}">${eur(res)}</dd></dl><div class="muted" style="font-size:12px">Clôture automatique en fin d'année : impôt des sociétés à 20 % jusqu'à 100 000 €, 25 % au-delà.</div></div>${S.closing?closingCard():''}</section>
  <section class="sec"><h2>TVA</h2>${S.tvaDecl?`<div class="card inc"><span class="label">À déposer avant le ${dateLabel(S.tvaDecl.due)}</span><h3>Déclaration ${S.tvaDecl.label}</h3>${tvaGrid(S.tvaDecl)}<button class="btn primary" data-a="tva">Déposer la déclaration</button></div>`:''}
  <div class="card"><span class="label">Trimestre en cours · T${quarterOf(S.week).q}</span>${tvaGrid(S.tq)}<div class="muted" style="font-size:12px">Les montants du jeu sont hors TVA ; la TVA à 21 % passe par ta trésorerie et se règle chaque trimestre.</div></div></section>`;
}

/* ---------- Profil du producteur ---------- */
function weekPerso(){
  const m=S.me;
  if(m.salary){pay(-m.salary,'Rémunération du producteur',{tva:false});m.cash+=Math.round(m.salary*.6)}
  if(m.placed>0){const g=Math.round(m.placed*m.rate/100/52);m.placed+=g;m.gains+=g}
}
function viewMoi(){const m=S.me;
  return `<section class="sec"><h2>Le producteur</h2><div class="card"><div class="label">Argent personnel</div><div class="film-title num">${eur(m.cash)}</div>
    <dl class="kv"><dt>Placements</dt><dd>${eur(m.placed)}</dd><dt>Rendement cette année</dt><dd>${String(m.rate).replace('.',',')} %</dd><dt>Gains de placement cumulés</dt><dd class="pos">${eur(m.gains)}</dd></dl></div></section>
  <section class="sec"><h2>Rémunération</h2><div class="card"><div class="muted" style="font-size:13px">Payée chaque semaine par le studio. Tu touches environ 60 % en net après précompte et cotisations sociales.</div>
    <div class="choices">${SALARIES.map(x=>`<button data-a="sal" data-id="${x}" aria-pressed="${m.salary===x}">${x?eur(x):'Aucune'}<small>${x?'≈ '+eur(x*.6)+' net/sem.':'—'}</small></button>`).join('')}</div></div></section>
  <section class="sec"><h2>Placements</h2><div class="card"><div class="muted" style="font-size:13px">Portefeuille d'actions : entre 2 et 7 % par an, le taux change chaque année.</div>
    <div class="btns"><button class="btn" data-a="place" data-id="5000" ${m.cash<5000?'disabled':''}>Placer 5 000 €</button><button class="btn" data-a="place" data-id="25000" ${m.cash<25000?'disabled':''}>Placer 25 000 €</button><button class="btn" data-a="place" data-id="all" ${m.cash<1?'disabled':''}>Tout placer</button><button class="btn" data-a="unplace" ${m.placed<1?'disabled':''}>Tout retirer</button></div></div></section>
  <section class="sec"><h2>Apport au studio</h2><div class="card"><div class="muted" style="font-size:13px">Injecte ton argent dans le studio (apport en capital).</div>
    <div class="btns">${[10000,50000,250000].map(x=>`<button class="btn" data-a="apport" data-id="${x}" ${m.cash<x?'disabled':''}>Apporter ${eur(x)}</button>`).join('')}</div></div></section>
  <section class="sec"><h2>Formations</h2>${TRAININGS.map(t=>`<div class="card"><div class="row"><h3>${t.n}</h3>${has(t.id)?'<span class="chip good">Acquise</span>':`<span class="num">${eur(t.c)}</span>`}</div><div class="muted" style="font-size:13px">${t.d}</div>${has(t.id)?'':`<button class="btn" data-a="train" data-id="${t.id}" ${m.cash<t.c?'disabled':''}>Suivre la formation</button>`}</div>`).join('')}</section>
  <section class="sec"><h2>Achats</h2>${BUYS.map(b=>{const own=m.owned.includes(b.id);return `<div class="card"><div class="row"><h3>${b.n}</h3>${own?'<span class="chip good">À toi</span>':`<span class="num">${eur(b.c)}</span>`}</div><div class="muted" style="font-size:13px">${b.rep?'Ton réseau s\'élargit : réputation +'+b.rep:'Pour le plaisir'}</div>${own?'':`<button class="btn" data-a="buy" data-id="${b.id}" ${m.cash<b.c?'disabled':''}>Acheter</button>`}</div>`}).join('')}</section>`;
}
function persoAct(a,id){const m=S.me;
  if(a==='sal'){m.salary=+id;toast(m.salary?'Rémunération fixée':'Rémunération supprimée')}
  if(a==='place'){const x=id==='all'?m.cash:Math.min(+id,m.cash);m.cash-=x;m.placed+=x;toast('Placé : '+eur(x))}
  if(a==='unplace'){m.cash+=m.placed;toast('Retiré : '+eur(m.placed));m.placed=0}
  if(a==='apport'){const x=+id;if(m.cash<x)return;m.cash-=x;pay(x,'Apport en capital du producteur',{k:'cap'});addLog(`Tu apportes ${eur(x)} au studio.`)}
  if(a==='train'){const t=TRAININGS.find(t=>t.id===id);if(m.cash<t.c)return;m.cash-=t.c;m.trained.push(id);addLog(`Formation suivie : ${t.n}.`)}
  if(a==='buy'){const b=BUYS.find(b=>b.id===id);if(m.cash<b.c)return;m.cash-=b.c;m.owned.push(id);S.rep=clamp(S.rep+b.rep,0,100);addLog(`Tu t'offres : ${b.n}.`)}
  save();render();
}


/* ---------- Classement, trophées, salles, contrats ---------- */
function rankTable(){return [...Object.entries(S.rivals).map(([n,g])=>({n,g})),{n:'MyStudio (toi)',g:S.yGross,me:true}].sort((a,b)=>b.g-a.g)}
function viewRanking(){const t=rankTable();
  return `<section class="sec"><h2>Classement ${dateOf(S.week).y}</h2><div class="card">${t.map((r,i)=>`<div class="row" style="flex-wrap:nowrap${r.me?';color:var(--gold);font-weight:700':''}"><span><span class="num">${i+1}.</span> ${esc(r.n)}</span><span class="num">${eur(r.g)}</span></div>`).join('')}
  <div class="muted" style="font-size:12px">Box-office cumulé de l'année. Objectif ultime : finir trois années à la 1re place (${S.n1}/3).</div></div>
  ${S.hist.length?`<div class="card"><span class="label">Années précédentes</span>${S.hist.map(h=>`<div class="row"><span>${h.y}</span><span><span class="chip ${h.pos===1?'gold':''}">${h.pos===1?'1er':h.pos+'e'}</span> <span class="num">${eur(h.g)}</span></span></div>`).join('')}</div>`:''}</section>`}
function viewTrophies(){const r=S.rec;
  return `<section class="sec"><h2>Records</h2><div class="card"><dl class="kv"><dt>Meilleur box-office</dt><dd>${r.gross?eur(r.gross.v):'—'}</dd><dt>Meilleure critique</dt><dd>${r.critic?critic(r.critic.v)+'/10':'—'}</dd><dt>Plus gros bénéfice</dt><dd>${r.profit?eur(r.profit.v):'—'}</dd></dl>
  <div class="muted" style="font-size:12px">${[r.gross&&'Box-office : '+esc(r.gross.t),r.critic&&'Critique : '+esc(r.critic.t),r.profit&&'Bénéfice : '+esc(r.profit.t)].filter(Boolean).join(' · ')}</div></div></section>
  <section class="sec"><h2>Trophées ${S.trophies.length}/${TROPHIES.length}</h2><div class="card">${TROPHIES.map(t=>{const ok=S.trophies.includes(t.id);return `<div class="row" style="flex-wrap:nowrap${ok?'':';opacity:.5'}"><div style="min-width:0"><strong>${t.n}</strong><div class="muted" style="font-size:12px">${t.d}</div></div><span class="chip ${ok?'gold':''}">${ok?'Obtenu':'À gagner'}</span></div>`}).join('')}</div></section>`}
function viewCinemas(){const own=ownScreens();
  return `<section class="sec"><h2>Mes cinémas</h2><div class="card"><dl class="kv"><dt>Écrans possédés</dt><dd>${own}</dd></dl><div class="muted" style="font-size:13px">Sur tes propres écrans, tu gardes 100 % des recettes de tes films au lieu de 50 %. Quand ils passent d'autres films, chaque écran te rapporte ${eur(SCREEN_INCOME)} par semaine.</div></div>
  ${CINEMAS.map(c=>{const o=S.cinemas.includes(c.id);return `<div class="card"><div class="row"><h3>${c.n}</h3>${o?'<span class="chip good">À toi</span>':`<span class="num">${eur(c.c)}</span>`}</div><div class="muted" style="font-size:13px">${c.sc} écrans</div>${o?'':`<button class="btn" data-a="cine" data-id="${c.id}" ${S.cash<c.c?'disabled':''}>Acheter</button>`}</div>`}).join('')}</section>`}
function viewTalents(){
  const list=[...S.directors.map(t=>({...t,role:'Réalisation'})),...S.actors.map(t=>({...t,role:'Acteur'}))].sort((a,b)=>!!b.contract-!!a.contract||b.talent-a.talent);
  return `<section class="sec"><h2>Talents</h2><div class="muted" style="font-size:13px">Un contrat de 3 films bloque le cachet à −25 % (plus de hausse après un succès), contre une prime de signature égale à un cachet. Les talents sous contrat progressent plus vite.</div>
  ${list.map(t=>`<div class="card"><div class="row"><div style="min-width:0"><h3>${esc(t.name)}</h3><div class="muted" style="font-size:12px">${t.role}${t.busy?' · en tournage':''}</div></div>${t.contract?`<span class="chip gold">Contrat · ${t.contract.left} film${t.contract.left>1?'s':''}</span>`:`<span class="num">${eur(feeOf(t))}</span>`}</div>${meters(t)}
  ${t.contract?'':`<button class="btn" data-a="sign" data-id="${t.id}" ${S.cash<feeOf(t)?'disabled':''}>Signer 3 films · prime ${eur(feeOf(t))}</button>`}</div>`).join('')}</section>`}
function buyCinema(id){const c=CINEMAS.find(c=>c.id===id);if(S.cash<c.c||S.cinemas.includes(id))return;
  pay(-c.c,`Achat : ${c.n}`,{k:'inv'});S.assets.push({c:c.c,w:S.week,n:c.n});S.cinemas.push(id);trophy('salles');addLog(`Tu rachètes ${c.n} (${c.sc} écrans).`)}
function signTalent(id){const t=[...S.directors,...S.actors].find(x=>x.id===id);if(!t||t.contract)return;const prime=feeOf(t);if(S.cash<prime)return;
  pay(-prime,`Prime de signature ${t.name} (contrat 3 films)`);t.contract={left:3,fee:Math.round(prime*.75)};trophy('contrat');addLog(`${t.name} signe un contrat de 3 films avec le studio.`)}

/* ---------- Événements ---------- */
let toastT;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='veil'&&e.target!==b)return;
  switch(a){
    case 'next':nextWeek();break;
    case 'tab':tab=id;render();window.scrollTo(0,0);break;
    case 'inc':resolveIncident(+id,+b.dataset.i);save();render();break;
    case 'wizard':openWizard();break;
    case 'veil':case 'close':W=null;R=null;renderSheet();break;
    case 'w-script':W.script=+id;renderSheet();break;
    case 'w-dir':W.dir=+id;renderSheet();break;
    case 'w-act':{const n=+id;W.cast=W.cast.includes(n)?W.cast.filter(x=>x!==n):W.cast.length<2?[...W.cast,n]:W.cast;renderSheet();break}
    case 'w-bud':W.budget=+id;renderSheet();break;
    case 'w-wk':W.weeks=clamp(W.weeks+(+id),3,12);renderSheet();break;
    case 'w-next':W.step++;renderSheet();document.querySelector('.sheet-body').scrollTop=0;break;
    case 'w-back':W.step--;renderSheet();break;
    case 'w-go':launchFilm();break;
    case 'release':openRelease(+id);break;
    case 'r-wk':R.off=+id;renderSheet();break;
    case 'r-go':confirmRelease();break;
    case 'upgrade':{const N=TIERS[S.tier+1];if(N&&S.rep>=N.rep&&S.cash>=N.cost){pay(-N.cost,`Passage au palier ${N.n}`,{k:'inv'});S.assets.push({c:N.cost,w:S.week,n:N.n});S.tier++;if(S.tier===3)trophy('major');addLog(`Le studio devient « ${N.n} » : ${N.plat} plateaux.`);refreshMarket();save();render();toast('Nouveau palier atteint')}break}
    case 'offer-ok':acceptOffer(+id,b.dataset.i);save();render();break;
    case 'offer-no':refuseOffer(+id,b.dataset.i);save();render();break;
    case 'sequel':startSequel(+id);render();break;
    case 'fest':submitFest(+id,+b.dataset.i);save();render();break;
    case 'tva':fileTva();save();render();toast('Déclaration déposée');break;
    case 'div':payDividend(+id);save();render();break;
    case 'sal':case 'place':case 'unplace':case 'apport':case 'train':case 'buy':persoAct(a,id);break;
    case 'cine':buyCinema(id);save();render();break;
    case 'sign':signTalent(+id);save();render();break;
    case 'reset1':document.getElementById('reset1').hidden=true;document.getElementById('reset2').hidden=false;break;
    case 'reset':newGame();save();tab='home';render();toast('Nouvelle partie');break;
  }
});
document.addEventListener('input',e=>{
  if(!R)return;
  if(e.target.id==='r-screens')R.screens=+e.target.value;
  else if(e.target.id==='r-mkt')R.mv=+e.target.value;
  else return;
  const p=proj(R.id),r=relSummary(p);
  document.getElementById('r-scr-l').textContent=R.screens;
  document.getElementById('r-mkt-l').textContent=eur(mktOf(R.mv));
  document.getElementById('r-sum').innerHTML=r.html;document.getElementById('r-foot').innerHTML=r.foot;
});

function migrate(){
  if(S.v===1){
    S.directors.forEach(d=>d.fee=r500(1500+d.talent*d.talent*2+d.star*d.star*12));
    S.actors.forEach(a=>a.fee=r500(1000+a.talent*a.talent*1.5+a.star*a.star*15));
    S.scripts.forEach(x=>x.price=r500((1000+x.quality*x.quality*2)*(1+S.tier*.8)));
    pay(90000,'Apport du producteur associé',{k:'cap'});
    addLog('Un producteur associé t\'apporte 90 000 €. Les cachets et les scénarios sont moins chers.');
    S.v=2;save();
  }
  if(S.v===2){addV3();S.projects.filter(p=>p.stage==='termine').forEach(p=>{p.outWeek=S.week;p.gross=p.run.reduce((t,r)=>t+r.gross,0);p.after={intl:{s:'',n:0},stream:{s:'',n:0},tv:{s:'',n:0}}});S.v=3;save()}
  if(S.v===3){addV4();S.v=4;save()}
}
function start(data){
  if(data&&data.S)S=data.S;else if(!load())newGame();
  migrate();
  if(data&&data.tab)tab=data.tab;
  window.claude?.hot?.snapshot?.(()=>({S,tab}));
  render();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
